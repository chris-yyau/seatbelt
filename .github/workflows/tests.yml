name: Tests

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Run tests
        run: bash tests/run-tests.sh

  shellcheck:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install shellcheck (macOS)
        if: runner.os == 'macOS'
        run: brew install shellcheck
      - name: Run shellcheck
        run: shellcheck hooks/scripts/scan-*.sh hooks/scripts/lib/*.sh scripts/doctor.sh

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Install scanners
        run: |
          # gitleaks
          GITLEAKS_VERSION=8.24.3
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz -C /usr/local/bin gitleaks
          # shellcheck (pre-installed on ubuntu-latest, verify)
          shellcheck --version
      - name: Integration test — gitleaks detects staged secrets
        run: |
          cd "$(mktemp -d)"
          git init -q && git config user.email "ci@test" && git config user.name "CI"
          # gitleaks --staged needs at least one commit to diff against
          echo "init" > init.txt && git add init.txt && git commit -q -m "init"
          # Generate a fake RSA private key at runtime (avoids GitGuardian false positive)
          openssl genrsa 2048 2>/dev/null > secret.txt
          git add secret.txt
          OUTPUT=$(gitleaks protect --staged --no-banner 2>&1) || EXIT=$?
          if [ "${EXIT:-0}" -ne 1 ]; then
            echo "FAIL: gitleaks should have found the secret (exit=$EXIT)"
            echo "OUTPUT: $OUTPUT"
            exit 1
          fi
          echo "PASS: gitleaks detected staged secret"
      - name: Integration test — shellcheck detects issues in staged .sh
        run: |
          cd "$(mktemp -d)"
          git init -q && git config user.email "ci@test" && git config user.name "CI"
          printf '#!/bin/bash\necho $UNQUOTED_VAR\n' > bad.sh
          git add bad.sh
          git show ":bad.sh" > /tmp/bad.sh
          OUTPUT=$(shellcheck --format=json1 /tmp/bad.sh 2>&1) || true
          COUNT=$(echo "$OUTPUT" | python3 -c "import sys,json; print(len(json.load(sys.stdin).get('comments',[])))" 2>/dev/null)
          if [ "$COUNT" -lt 1 ]; then
            echo "FAIL: shellcheck should have found issues (count=$COUNT)"
            exit 1
          fi
          echo "PASS: shellcheck found $COUNT issue(s) — JSON parsing works"
      - name: Integration test — doctor.sh outputs valid JSON
        run: |
          OUTPUT=$(bash scripts/doctor.sh 2>/dev/null)
          echo "$OUTPUT" | python3 -m json.tool > /dev/null
          echo "PASS: doctor.sh JSON is valid"
          # Verify gitleaks shows as installed
          echo "$OUTPUT" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d['gitleaks']['installed'] == True, 'gitleaks should be installed'
          assert 'health' in d, 'health section should exist'
          print('PASS: doctor correctly detects installed scanners')
          "

  version-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Check version sync
        run: ./scripts/bump-version.sh --check

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22
      - run: npm install @commitlint/cli @commitlint/config-conventional
      - run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
